name: Validate Registry

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate registry
        uses: pullminder/action@v1
        with:
          strict: "true"
          comment: "true"
